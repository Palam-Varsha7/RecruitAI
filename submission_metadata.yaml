ai_tools_used:
  - "ChatGPT"

ai_usage_summary: |
  Used ChatGPT/Codex as an engineering assistant to inspect the dataset bundle,
  implement and refine the deterministic offline ranker, draft documentation,
  and generate the explanation deck. No candidate ranking step uses hosted LLM
  calls or network access.

methodology_summary: |
  Deterministic CPU-only hybrid ranker for the Senior AI Engineer JD. It combines
  title fit, production retrieval/ranking evidence, trusted skill strength,
  product-company context, experience/location fit, and Redrob behavioral
  availability. It explicitly downweights services-only careers, stale profiles,
  side-project-only AI exposure, keyword-stuffed non-engineering profiles, and
  honeypot-like impossible claims. The generated reasoning cites only facts from
  each candidate profile.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
